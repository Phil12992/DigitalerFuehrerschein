function showTab(t) {
  document.querySelectorAll('.ipad-only').forEach(el => el.style.display = t === 'ipad' ? '' : 'none');
  document.querySelectorAll('.samsung-only').forEach(el => el.style.display = t === 'samsung' ? '' : 'none');
  document.getElementById('tog-ipad').classList.toggle('active', t === 'ipad');
  document.getElementById('tog-samsung').classList.toggle('active', t === 'samsung');
}

let current = 0;

function toggleCheck(li) {
  li.classList.toggle('checked');
  const box = li.querySelector('.cl-box');
  if (box) box.textContent = li.classList.contains('checked') ? String.fromCharCode(10003) : '';
}

function renderNav() {
  const nav = document.getElementById('chapter-nav');
  nav.innerHTML = '';
  const done = countDone(MOD, CHAPTERS.length);
  document.getElementById('prog-text').textContent = done + ' von ' + CHAPTERS.length + ' Kapiteln abgeschlossen';
  document.getElementById('prog-bar').style.width = Math.round((done / CHAPTERS.length) * 100) + '%';
  CHAPTERS.forEach((ch, i) => {
    const li = document.createElement('li');
    const isDone = isChapterDone(MOD, i);
    li.className = (i === current ? 'active ' : '') + (isDone ? 'done' : '');
    li.innerHTML = '<span class="ch-dot">' + (isDone ? String.fromCharCode(10003) : (i + 1)) + '</span>' + ch.icon + ' ' + ch.title;
    li.addEventListener('click', () => { current = i; renderChapter(); renderNav(); });
    nav.appendChild(li);
  });
}

function renderChapter() {
  const ch = CHAPTERS[current];
  const area = document.getElementById('content-area');
  const isDone = isChapterDone(MOD, current);
  area.innerHTML = '<div class="ch-header fade-up">' +
    '<span class="ch-tag">' + ch.tag + '</span>' +
    '<h1>' + ch.icon + ' ' + ch.title + '</h1>' +
    '<p>' + ch.desc + '</p>' +
    '</div>' +
    ch.content +
    '<div class="ch-actions">' +
    '<button class="btn btn-success" onclick="markDone()">' +
    (isDone ? String.fromCharCode(10003) + ' Abgeschlossen' : String.fromCharCode(10003) + ' Kapitel abschliessen') +
    '</button>' +
    (current < CHAPTERS.length - 1 ? '<button class="btn btn-outline" onclick="nextChapter()">Naechstes Kapitel &rarr;</button>' : '') +
    (current === CHAPTERS.length - 1 ? '<a href="quiz.html" class="btn btn-accent">Zum Abschlussquiz &rarr;</a>' : '') +
    '</div>';
  window.scrollTo(0, 0);
}

function markDone() {
  saveChapterDone(MOD, current);
  renderNav();
  renderChapter();
}

function nextChapter() {
  if (current < CHAPTERS.length - 1) { current++; renderChapter(); renderNav(); }
}

document.addEventListener('DOMContentLoaded', () => {
  renderNav();
  renderChapter();
});
</script>
