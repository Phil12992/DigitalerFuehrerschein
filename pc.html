    title: "Konzentriert Arbeiten",

    content: `
      <div class="content-block">

  {

    desc: "Passwoerter, Phishing und sicheres Surfen - so schuetzt du dich online.",
    content: `
      <div class="content-block">
        <h2>Starke Passwoerter</h2>

        <div class="ibox warn"><span class="ibox-icon">&#10007;</span><div class="ibox-body"><strong>Schlechte Passwoerter</strong><p>Max2008 &nbsp;|&nbsp; 123456 &nbsp;|&nbsp; passwort &nbsp;|&nbsp; geburtstagsdatum</p></div></div>
        <h2>Phishing erkennen</h2>

      <div class="content-block">
        <h2>Professionelle E-Mails schreiben</h2>
        <p>E-Mails an Lehrkraefte sind keine WhatsApp-Nachrichten. Sie brauchen eine klare Struktur und hoefliche Sprache.</p>

        <ul class="checklist">
          <li onclick="toggleCheck(this)"><span class="cl-box"></span>Respektvoll und hoeflich formulieren - auch online</li>

  {

    title: "Geraetepflege",

    desc: "Deinen Laptop pflegen, Akku schonen und ihn sicher transportieren.",
    content: `
      <div class="content-block">
        <h2>Akku optimal pflegen</h2>
        <p>Lithium-Akkus halten am laengsten, wenn sie nicht staendig voll- oder leergeladen werden. Der ideale Bereich liegt zwischen 20% und 80%.</p>
        <div class="ibox tip"><span class="ibox-icon">&#128161;</span><div class="ibox-body"><strong>Akku-Tipp</strong><ul><li>Ladestand zwischen 20-80% halten</li><li>Extreme Hitze und Kaelte vermeiden</li><li>Windows 11: Akku-Schonungsmodus aktivieren (Einstellungen > System > Akku)</li><li>Bildschirmhelligkeit reduzieren spart Akku</li></ul></div></div>

          <li onclick="toggleCheck(this)"><span class="cl-box"></span>Kein Druck auf dem Deckel (keine Buecher drauf stapeln)</li>
          <li onclick="toggleCheck(this)"><span class="cl-box"></span>Fluessigkeiten immer vom Geraet fernhalten</li>
          <li onclick="toggleCheck(this)"><span class="cl-box"></span>Geraet vor dem Einpacken ausreichend abkuehlen lassen</li>
          <li onclick="toggleCheck(this)"><span class="cl-box"></span>Windows Updates regelmaessig installieren</li>
          <li onclick="toggleCheck(this)"><span class="cl-box"></span>Geraet regelmaessig mit einem trockenen Tuch reinigen</li>
        </ul>
        <div class="ibox warn"><span class="ibox-icon">&#9888;</span><div class="ibox-body"><strong>Schadensfall</strong><p>Bei Schaeden sofort die Schule informieren. Auf eigene Faust reparieren oder reparieren lassen ist oft teurer und riskanter.</p></div></div>

  },
  {
    icon: "&#128218;",
    title: "Schulregeln & Etikette",
    tag: "Kapitel 8",
    desc: "Wann und wie du das Geraet im Unterricht benutzen darfst - und was verboten ist.",
    content: `
      <div class="content-block">
        <h2>Grundprinzip: Das Geraet ist ein Lernwerkzeug</h2>
        <p>Dein Laptop darf im Unterricht genutzt werden - aber nur als Lernwerkzeug. Private Aktivitaeten, Spiele und Social Media sind waehrend des Unterrichts verboten.</p>
        <div class="ibox ok"><span class="ibox-icon">&#10003;</span><div class="ibox-body"><strong>Erlaubt im Unterricht</strong><ul><li>Mitschreiben und Notizen machen</li><li>Recherche fuer den Unterricht</li><li>Aufgaben bearbeiten (wenn von Lehrkraft aufgegeben)</li><li>Praesentation zeigen</li><li>Schulplattform / Teams nutzen</li></ul></div></div>
        <div class="ibox warn"><span class="ibox-icon">&#10007;</span><div class="ibox-body"><strong>Verboten im Unterricht</strong><ul><li>Social Media, YouTube, Gaming</li><li>Private Chats und WhatsApp</li><li>Nutzung ohne Erlaubnis der Lehrkraft</li><li>Fotos ohne Erlaubnis machen</li><li>Stoerende Benachrichtigungen</li></ul></div></div>
        <h2>Datenschutz und Recht am Bild</h2>

        <div class="ibox info"><span class="ibox-icon">&#8505;</span><div class="ibox-body"><strong>Cyber-Mobbing</strong><p>Beleidigen, Bedrohen oder Bloessestellen ueber digitale Kanaele ist Cyber-Mobbing - und strafbar. Bei Vorfaellen: Screenshot sichern, melden, Vertrauensperson ansprechen.</p></div></div>
        <h2>KI verantwortungsvoll nutzen</h2>
        <p>KI-Tools wie ChatGPT koennen beim Lernen helfen - aber nicht als Ersatz fuer eigenes Denken. KI-generierte Texte als eigene Arbeit abzugeben ist Taeuschungsversuch.</p>
        <ul class="checklist">
          <li onclick="toggleCheck(this)"><span class="cl-box"></span>Geraet nur mit Erlaubnis der Lehrkraft im Unterricht nutzen</li>

          <li onclick="toggleCheck(this)"><span class="cl-box"></span>Keine Fotos ohne Erlaubnis</li>
          <li onclick="toggleCheck(this)"><span class="cl-box"></span>KI-Nutzung immer transparent machen</li>
          <li onclick="toggleCheck(this)"><span class="cl-box"></span>Bei Cyber-Mobbing sofort melden</li>
          <li onclick="toggleCheck(this)"><span class="cl-box"></span>Schulregeln zur Geraetenutzung kennen und einhalten</li>
        </ul>
      </div>`
  }
];

let current = 0;

function toggleCheck(li) {
  li.classList.toggle('checked');
  const box = li.querySelector('.cl-box');
  if (box) box.textContent = li.classList.contains('checked') ? '&#10003;' : '';
}

function renderNav() {
  const nav = document.getElementById('chapter-nav');
  nav.innerHTML = '';
  const done = countDone(MOD, CHAPTERS.length);
  document.getElementById('prog-text').textContent = done + ' von ' + CHAPTERS.length + ' Kapiteln abgeschlossen';
  document.getElementById('prog-bar').style.width = Math.round((done / CHAPTERS.length) * 100) + '%';
  CHAPTERS.forEach((ch, i) => {
    const li = document.createElement('li');
    const isDone = isChapterDone(MOD, i);
    li.className = (i === current ? 'active ' : '') + (isDone ? 'done' : '');
    li.innerHTML = '<span class="ch-dot">' + (isDone ? '&#10003;' : (i + 1)) + '</span>' + ch.icon + ' ' + ch.title;
    li.addEventListener('click', () => { current = i; renderChapter(); renderNav(); });
    nav.appendChild(li);
  });
}

function renderChapter() {
  const ch = CHAPTERS[current];
  const area = document.getElementById('content-area');
  const isDone = isChapterDone(MOD, current);
  area.innerHTML = '<div class="ch-header fade-up">' +
    '<span class="ch-tag">' + ch.tag + '</span>' +
    '<h1>' + ch.icon + ' ' + ch.title + '</h1>' +
    '<p>' + ch.desc + '</p>' +
    '</div>' +
    ch.content +
    '<div class="ch-actions">' +
    '<button class="btn btn-success' + (isDone ? ' btn-done' : '') + '" onclick="markDone()" id="btn-done">' +
    (isDone ? '&#10003; Abgeschlossen' : '&#10003; Kapitel abschliessen') +
    '</button>' +
    (current < CHAPTERS.length - 1 ? '<button class="btn btn-outline" onclick="nextChapter()">Naechstes Kapitel &rarr;</button>' : '') +
    (current === CHAPTERS.length - 1 ? '<a href="quiz.html" class="btn btn-accent">Zum Abschlussquiz &rarr;</a>' : '') +
    '</div>';
  window.scrollTo(0, 0);
}

function markDone() {
  saveChapterDone(MOD, current);
  renderNav();
  renderChapter();
}

function nextChapter() {
  if (current < CHAPTERS.length - 1) { current++; renderChapter(); renderNav(); }
}

document.addEventListener('DOMContentLoaded', () => {
  renderNav();
  renderChapter();
});
</script>
</body>
</html>
